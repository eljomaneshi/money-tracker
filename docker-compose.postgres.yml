version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: money_tracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: money_tracker_postgres_data
